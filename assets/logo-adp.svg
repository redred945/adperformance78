<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 268 86" role="img" aria-label="AD Performance">
  <defs>
    <linearGradient id="adpSlash" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#0060c8"/>
      <stop offset=".55" stop-color="#0a84ff"/>
      <stop offset="1" stop-color="#5ac8fa"/>
    </linearGradient>
  </defs>
  <!-- fine electric slash under the monogram -->
  <g transform="rotate(-13 120 60)">
    <rect x="2" y="60" width="196" height="7" rx="1.5" fill="url(#adpSlash)"/>
    <rect x="202" y="60" width="12" height="7" rx="1.5" fill="url(#adpSlash)" opacity=".65"/>
    <rect x="218" y="60" width="6" height="7" rx="1.5" fill="url(#adpSlash)" opacity=".35"/>
  </g>
  <!-- monogram -->
  <text x="1" y="54" font-family="'Arial Black',Arial,sans-serif" font-weight="900"
        font-style="italic" font-size="58" letter-spacing="-1" fill="#f4f6f8"
        transform="skewX(-7)">ADP</text>
  <!-- descriptor -->
  <text x="146" y="82" font-family="'JetBrains Mono','SFMono-Regular',ui-monospace,monospace"
        font-weight="700" font-size="13" letter-spacing="5.5" fill="#8b93a1"
        transform="skewX(-7)">PERFORMANCE</text>
</svg>
