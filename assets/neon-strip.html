<!doctype html>
<meta charset="utf-8">
<title>neon strip</title>
<link rel="stylesheet" href="styles.css?v=16">
<style>
  body { margin: 0; background: #050506; font-family: "JetBrains Mono", monospace; }
  .head { color: #f2f4f7; padding: 26px 30px 6px; font-size: 15px; letter-spacing: .14em; text-transform: uppercase; }
  .sub  { color: #7b828d; padding: 0 30px 22px; font-size: 12px; letter-spacing: .06em; }
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; padding: 0 30px 30px; }
  .frame {
    position: relative; aspect-ratio: 16/9; background: #000; overflow: hidden;
    border: 1px solid rgba(255,255,255,.1); border-radius: 8px;
    display: grid; place-items: center;
  }
  /* bloom — mêmes keyframes que le vrai */
  .frame .nb {
    position: absolute; inset: 0; z-index: 0;
    background: radial-gradient(58% 44% at 50% 50%, rgba(255,255,255,.5), rgba(255,255,255,0) 70%);
    opacity: 0;
    animation: neonBloom 1.5s steps(1, end) 0s paused forwards;
    animation-delay: var(--t);
  }
  .frame .scan {
    position: absolute; inset: 0; z-index: 2; pointer-events: none;
    background: repeating-linear-gradient(180deg, rgba(255,255,255,.035) 0 1px, transparent 1px 3px);
    mix-blend-mode: overlay; opacity: .45;
  }
  .frame .neon-logo {
    width: 62%; animation: neonBuzz 1.5s steps(1, end) 0s paused forwards;
    animation-delay: var(--t);
  }
  .frame .neon-logo img {
    width: 100%; height: auto; display: block; opacity: 0;
    animation: neonOn 1.5s steps(1, end) 0s paused forwards;
    animation-delay: var(--t);
  }
  .t {
    position: absolute; left: 8px; bottom: 6px; z-index: 3;
    color: #9aa0aa; font-size: 10px; letter-spacing: .1em;
    background: rgba(0,0,0,.6); padding: 2px 6px; border-radius: 4px;
  }
  .t b { color: #f2f4f7; font-weight: 700; }
</style>
<body>
<div class="head">ADP — amorçage néon</div>
<div class="sub">1,50 s au total · 3 tentatives sèches puis surexposition · lecture de gauche à droite</div>
<div class="grid" id="g"></div>
<script>
/* échantillonné au milieu de chaque palier de steps(), pas sur les frontières */
const frames = [
  [0.06,'noir'], [0.14,'1re tentative'], [0.19,'ça lâche'], [0.34,'2e tentative'],
  [0.39,'à-coup'], [0.45,'ça lâche'], [0.62,'AMORÇAGE'], [0.68,'surexposé'],
  [0.75,'creux'], [0.82,'remonte'], [0.90,'stabilisé'], [1.40,'régime établi']
];
document.getElementById('g').innerHTML = frames.map(([t,lab]) =>
  `<div class="frame" style="--t:-${t}s">
     <div class="nb"></div>
     <div class="neon-logo"><img src="logo-adp.png" alt=""></div>
     <div class="scan"></div>
     <span class="t"><b>${t.toFixed(2)}s</b> · ${lab}</span>
   </div>`).join('');
</script>
</body>
